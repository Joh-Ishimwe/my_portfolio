<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>About me — Josiane Ishimwe</title>
  <meta name="description" content="About Josiane Ishimwe, data engineer in Kigali, Rwanda.">
  <link rel="stylesheet" href="css/style.css?v=26">
</head>
<body data-page="about">
  <header class="nav" id="siteNav"></header>

  <main class="page">
    <header class="page-head">
      <h1>About me</h1>
      <p class="muted">Who I am and how I work.</p>
    </header>

    <!-- ABOUT -->
    <section id="about" class="section about">
      <img id="aboutPhoto" alt="Portrait of Josiane Ishimwe">
      <div>
        <div id="aboutText"></div>
        <a class="btn primary" id="cvBtn" download>Download CV</a>
      </div>
    </section>

    <!-- CONTACT -->
    <section id="contact" class="section">
      <h2>Get in touch</h2>
      <p class="muted">Send me a message and your email app will open with it ready to send.</p>
      <form class="contact-form" id="contactForm">
        <label>Your name
          <input name="name" type="text" required autocomplete="name">
        </label>
        <label>Your email
          <input name="email" type="email" required autocomplete="email">
        </label>
        <label>Message
          <textarea name="message" rows="6" required></textarea>
        </label>
        <button class="btn primary" type="submit">Send message</button>
      </form>
    </section>
  </main>

  <footer id="siteFooter" class="footer"></footer>

  <script src="js/data.js?v=26"></script>
  <script src="js/layout.js?v=26"></script>
  <script src="js/main.js?v=26"></script>
</body>
</html>
