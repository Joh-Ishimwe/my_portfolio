<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Josiane Ishimwe — Data Engineer</title>
  <meta name="description" content="Portfolio of Josiane Ishimwe, data engineer based in Kigali, Rwanda.">
  <link rel="stylesheet" href="css/style.css?v=23">
</head>
<body data-page="home">
  <header class="nav" id="siteNav"></header>

  <main id="top">
    <!-- HERO -->
    <section class="hero">
      <div class="hero-text">
        <p class="eyebrow mono" id="heroRole"></p>
        <h1 id="heroName"></h1>
        <p class="tagline" id="heroTagline"></p>
        <div class="hero-cta">
          <a class="btn primary" href="#projects">See my work</a>
          <a class="btn ghost" href="about.html#contact">Get in touch</a>
        </div>
      </div>

      <!-- Chat assistant: cartoon twin + speech bubble -->
      <div class="chat-col">
        <p class="chat-intro" id="chatIntro"></p>
        <div class="chat" id="chat">
          <div class="chat-stage">
            <div class="avatar-wrap" id="avatarWrap">
              <div class="avatar-tilt" id="avatarTilt">
                <div class="avatar-stack" id="avatarStack">
                  <img id="avatarStill" class="avatar" alt="Avatar of Josiane">
                  <video id="avatarVideo" class="avatar" muted loop playsinline preload="auto" aria-hidden="true"></video>
                </div>
              </div>
            </div>
            <p class="sr-only" id="srAnswer" aria-live="polite"></p>
            <div class="bubble" id="bubble">
              <p class="you-asked" id="youAsked"></p>
              <p id="bubbleText"></p>
            </div>
          </div>
          <div class="chat-suggest" id="chatSuggest"></div>
          <form class="chat-input" id="chatForm">
            <input id="chatInput" type="text" placeholder="Ask anything about Josiane" autocomplete="off" aria-label="Ask a question">
            <button type="submit">Send</button>
          </form>
        </div>
      </div>
    </section>

    <!-- PROJECTS -->
    <section id="projects" class="section">
      <div class="section-head">
        <h2>Project highlights <span class="muted">— lezz go!</span></h2>
        <div class="scroll-nav">
          <button type="button" id="projPrev" aria-label="Previous project">‹</button>
          <button type="button" id="projNext" aria-label="Next project">›</button>
        </div>
      </div>
      <div class="projects" id="projectGrid"></div>
    </section>

    <!-- ACHIEVEMENTS carousel -->
    <section id="achievements" class="section">
      <div class="section-head">
        <h2>Recent achievements</h2>
        <button class="marquee-toggle" id="marqueeToggle" type="button" aria-pressed="false">❚❚ Pause</button>
      </div>
      <div class="marquee" id="marquee">
        <div class="marquee-track" id="achTrack"></div>
      </div>
    </section>

  </main>

  <footer id="siteFooter" class="footer"></footer>

  <script src="js/data.js?v=23"></script>
  <script src="js/layout.js?v=23"></script>
  <script src="js/chat-engine.js?v=23"></script>
  <script src="js/main.js?v=23"></script>
</body>
</html>
